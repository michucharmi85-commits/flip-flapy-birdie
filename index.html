<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipy Flapy Birdie 🐦</title>

  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    canvas {
      background: skyblue;
      width: min(100vw, 400px);
      height: min(100vh, 600px);
      touch-action: none;
    }
  </style>
</head>

<body>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird;
let pipes;
let score;
let started;
let gameOver;

function resetGame() {
  bird = {
    x: 80,
    y: 300,
    size: 18,
    velocity: 0
  };

  pipes = [];
  score = 0;
  started = false;
  gameOver = false;
}

function flap() {
  if (gameOver) {
    resetGame();
    return;
  }

  started = true;
  bird.velocity = -7;
}

function makePipe() {
  const gap = 150;
  const top = Math.random() * 250 + 50;

  pipes.push({
    x: 400,
    top: top,
    bottom: top + gap,
    width: 60,
    passed: false
  });
}

function update() {
  if (!started || gameOver) return;

  bird.velocity += 0.45;
  bird.y += bird.velocity;

  if (pipes.length === 0 || pipes[pipes.length - 1].x < 220) {
    makePipe();
  }

  for (let pipe of pipes) {
    pipe.x -= 2.5;

    if (!pipe.passed && pipe.x + pipe.width < bird.x) {
      pipe.passed = true;
      score++;
    }

    if (
      bird.x + bird.size > pipe.x &&
      bird.x - bird.size < pipe.x + pipe.width &&
      (
        bird.y - bird.size < pipe.top ||
        bird.y + bird.size > pipe.bottom
      )
    ) {
      gameOver = true;
    }
  }

  pipes = pipes.filter(pipe => pipe.x + pipe.width > 0);

  if (
    bird.y - bird.size < 0 ||
    bird.y + bird.size > 600
  ) {
    gameOver = true;
  }
}

function draw() {
  ctx.clearRect(0, 0, 400, 600);

  // Sky
  ctx.fillStyle = "#70c5ce";
  ctx.fillRect(0, 0, 400, 600);

  // Pipes
  ctx.fillStyle = "#35a853";

  for (let pipe of pipes) {
    ctx.fillRect(pipe.x, 0, pipe.width, pipe.top);
    ctx.fillRect(
      pipe.x,
      pipe.bottom,
      pipe.width,
      600 - pipe.bottom
    );
  }

  // Bird
  ctx.fillStyle = "yellow";
  ctx.beginPath();
  ctx.arc(
    bird.x,
    bird.y,
    bird.size,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Eye
  ctx.fillStyle = "black";
  ctx.beginPath();
  ctx.arc(
    bird.x + 7,
    bird.y - 6,
    3,
    0,
    Math.PI * 2
  );
  ctx.fill();

  // Beak
  ctx.fillStyle = "orange";
  ctx.beginPath();
  ctx.moveTo(bird.x + 17, bird.y);
  ctx.lineTo(bird.x + 29, bird.y + 5);
  ctx.lineTo(bird.x + 17, bird.y + 9);
  ctx.fill();

  // Score
  ctx.fillStyle = "white";
  ctx.font = "28px Arial";
  ctx.textAlign = "center";
  ctx.fillText(score, 200, 50);

  if (!started && !gameOver) {
    ctx.font = "24px Arial";
    ctx.fillText("TAP TO FLAP!", 200, 300);
  }

  if (gameOver) {
    ctx.font = "32px Arial";
    ctx.fillText("GAME OVER!", 200, 270);

    ctx.font = "22px Arial";
    ctx.fillText("Tap to restart", 200, 320);
  }
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener("click", flap);

canvas.addEventListener("touchstart", function(e) {
  e.preventDefault();
  flap();
});

document.addEventListener("keydown", function(e) {
  if (e.code === "Space") {
    flap();
  }
});

resetGame();
gameLoop();
</script>

</body>
</html>
